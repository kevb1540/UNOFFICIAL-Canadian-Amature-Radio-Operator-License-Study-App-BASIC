plugins { id 'com.android.application' }
android {
    namespace 'ca.kevin.maplewave'
    compileSdk 36
    defaultConfig {
        applicationId 'ca.kevin.maplewave'
        minSdk 26
        targetSdk 36
        versionCode 278
        versionName '2.3.48'
    }
    signingConfigs {
        development {
            storeFile file('../android_development/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    if (System.getenv('RADIO_RELEASE_KEYSTORE') != null) {
        signingConfigs {
            releaseKey {
                storeFile file(System.getenv('RADIO_RELEASE_KEYSTORE'))
                storePassword System.getenv('RADIO_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RADIO_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RADIO_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.development }
        release {
            if (System.getenv('RADIO_RELEASE_KEYSTORE') != null) {
                signingConfig signingConfigs.releaseKey
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

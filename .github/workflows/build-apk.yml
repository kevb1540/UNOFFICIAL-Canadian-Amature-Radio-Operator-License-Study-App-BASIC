name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      HAS_RELEASE_KEY: ${{ secrets.RADIO_RELEASE_KEYSTORE_BASE64 != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android API 36 using runner SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Restore persistent release signing key
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.RADIO_RELEASE_KEYSTORE_BASE64 }}
          RADIO_RELEASE_STORE_PASSWORD: ${{ secrets.RADIO_RELEASE_STORE_PASSWORD }}
        run: |
          mkdir -p android_development
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android_development/release.keystore
          keytool -list -keystore android_development/release.keystore -storepass "$RADIO_RELEASE_STORE_PASSWORD" >/dev/null
      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RADIO_RELEASE_KEYSTORE: ../android_development/release.keystore
          RADIO_RELEASE_STORE_PASSWORD: ${{ secrets.RADIO_RELEASE_STORE_PASSWORD }}
          RADIO_RELEASE_KEY_ALIAS: ${{ secrets.RADIO_RELEASE_KEY_ALIAS }}
          RADIO_RELEASE_KEY_PASSWORD: ${{ secrets.RADIO_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Upload signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Canadian-Amateur-Radio-Study-Guide-v2.3.50-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90
      - name: Create disposable debug signing key
        run: |
          mkdir -p android_development
          keytool -genkeypair -noprompt -keystore android_development/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Canadian Amateur Radio Study Guide,C=CA"
      - name: Build Android debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Canadian-Amateur-Radio-Study-Guide-v2.3.50-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
